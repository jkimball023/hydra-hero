<title>Hydra Hero Teaser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400&family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400&display=swap">
<style>
/* Layout: single-screen teaser. The organism fills the stage, centered; hero copy sits centered over it on a soft radial scrim. Dark-first, Hydra palette. */
:root{
  --bg:#151514; --fg:#f7f6f6; --muted:#9a968f;
  --accent:#c8cf36; --accent-ink:#151514; --ghost:#c8cf36;
  --net-line:#f7f6f6; --net-node:#f7f6f6; --net-signal:#c8cf36;
  --scrim:rgba(21,21,20,.78); --scrim-0:rgba(21,21,20,0);
  --f-display:"Arimo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f7f6f6; --fg:#232424; --muted:#65625d;
  --accent:#c8cf36; --accent-ink:#232424;
  --net-line:#232424; --net-node:#232424; --net-signal:#656722; --ghost:#656722;
  --scrim:rgba(247,246,246,.82); --scrim-0:rgba(247,246,246,0);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f7f6f6; --fg:#232424; --muted:#65625d;
  --accent:#c8cf36; --accent-ink:#232424;
  --net-line:#232424; --net-node:#232424; --net-signal:#656722; --ghost:#656722;
  --scrim:rgba(247,246,246,.82); --scrim-0:rgba(247,246,246,0);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

.stage{position:relative;height:100%;min-height:600px;overflow:hidden;background:var(--bg);touch-action:pan-y;cursor:crosshair}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.grain{position:absolute;inset:-80px;pointer-events:none;opacity:.075;mix-blend-mode:screen;background-size:80px 80px;animation:grain .8s steps(1) infinite}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .grain{mix-blend-mode:multiply;opacity:.06}}
:root[data-theme="light"] .grain{mix-blend-mode:multiply;opacity:.06}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-31px,17px)}40%{transform:translate(23px,-41px)}60%{transform:translate(-47px,-11px)}80%{transform:translate(13px,37px)}}
@media (prefers-reduced-motion: reduce){.grain{animation:none}}
.scrim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 34% 30% at 50% 52%,var(--scrim) 0%,var(--scrim) 35%,var(--scrim-0) 100%)}
@media (max-width:700px){.scrim{background:radial-gradient(ellipse 70% 32% at 50% 52%,var(--scrim) 0%,var(--scrim) 40%,var(--scrim-0) 100%)}}

.nav{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding-block:22px;z-index:2;pointer-events:none}
.brand{display:flex;color:var(--fg)}
.brand svg{display:block;width:102px;height:39px}
.nav-links{display:flex;gap:28px;align-items:center;color:var(--muted);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.nav-cta{pointer-events:auto;background:transparent;color:var(--ghost);border:1px solid var(--ghost);border-radius:3px;padding:10px 16px;font:inherit;font-weight:400;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.nav-cta:hover{background:color-mix(in srgb,var(--ghost) 12%,transparent)}
.nav-cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:700px){.nav-links span{display:none}}

.copy{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;text-align:center;gap:22px;pointer-events:none}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,5.6vw,76px);line-height:1.03;letter-spacing:-.02em;margin:0;max-width:17ch;text-wrap:balance;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.sub{font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:clamp(17px,1.6vw,20px);color:var(--muted);margin:0;max-width:40ch;text-wrap:balance}
.cta{pointer-events:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:15px 22px;font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:clamp(28px,4.5vh,48px)}
.cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.theme{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:10px;
  background:none;border:0;padding:4px;color:var(--muted);cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.theme .track{position:relative;width:38px;height:20px;border-radius:10px;border:1px solid var(--muted);transition:border-color .25s}
.theme .knob{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg);transition:transform .25s ease}
.theme[aria-checked="false"] .knob{transform:translateX(18px)}
.theme:hover .track{border-color:var(--fg)}
.theme:focus{outline:none}
.theme:focus-visible .track{outline:1px solid var(--fg);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.theme .knob,.theme .track{transition:none}}
.marks{position:absolute;inset:0;z-index:1;pointer-events:none}
.marks i{position:absolute;width:15px;height:15px;transform:translate(-50%,-50%);opacity:.38}
.marks i::before,.marks i::after{content:"";position:absolute;background:var(--muted)}
.marks i::before{left:0;right:0;top:7px;height:1px}
.marks i::after{top:0;bottom:0;left:7px;width:1px}
@media (max-width:700px){.marks i.c{display:none}}
.hint{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;color:var(--muted);pointer-events:none;transition:opacity .6s}
</style>

<script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
<script>
(()=>{
const stage=document.getElementById('stage');
const cS=document.getElementById('netStatic'), cL=document.getElementById('netLive');
const xS=cS.getContext('2d'), xL=cL.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0,H=0,DPR=1,narrow=false;
let nx,ny,nr,lobeOf,lit,refr,adj,mark,skin;
let BX,BY,bz,dep,Cx=0,Cy=0,rY=0,rX=0,vY=0,F3=2200,swPh=0,swDir=0;const SWING=.95;
let ea,eb,elen,eplate;
let N=0,E=0,lobes=[],grid=new Map(),CELL=36,bbox={};
let signals=[],litList=new Set(),dust=[],motes=[];
let col={line:[247,246,246],node:[247,246,246],sig:[200,207,54],muted:[154,150,143],dark:true};
// thermal: rust at the hot core, pale chartreuse around it, then mint and sea-green cooling to deep teal
// warm: a yellow-orange core, a brand-lime halo, then pink cooling to magenta at the edge of the spread
const STOPS=[[1,[250,216,112]],[.85,[245,172,62]],[.7,[236,124,48]],[.56,[228,150,124]],[.43,[200,207,54]],[.29,[230,134,192]],[0,[164,76,146]]];
let litEn;
function sigCol(en){en=clamp(en,0,1);for(let k=1;k<STOPS.length;k++){const [e0,c0]=STOPS[k-1],[e1,c1]=STOPS[k];
  if(en>=e1){const t=(e0-en)/(e0-e1);let c=[0,1,2].map(j=>Math.round(c0[j]+(c1[j]-c0[j])*t));
    if(!col.dark)c=vivid(c);return c}}return col.dark?STOPS[STOPS.length-1][1]:vivid(STOPS[STOPS.length-1][1])}
function vivid([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,sa=0;
  if(d){sa=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  sa=Math.min(1,sa*1.35+.08);const L=Math.min(l,.5)*.92,C=(1-Math.abs(2*L-1))*sa,X=C*(1-Math.abs((h/60)%2-1)),m=L-C/2;
  const [r1,g1,b1]=h<60?[C,X,0]:h<120?[X,C,0]:h<180?[0,C,X]:h<240?[0,X,C]:h<300?[X,0,C]:[C,0,X];
  return [r1,g1,b1].map(v=>Math.round((v+m)*255))}
const MSPX=3.6, REFR=1100, MAXSIG=3600, DECAY=.87;

const rand=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hex(h){h=h.trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function readColors(){const cs=getComputedStyle(document.documentElement);
  col.line=hex(cs.getPropertyValue('--net-line'));col.node=hex(cs.getPropertyValue('--net-node'));
  col.sig=hex(cs.getPropertyValue('--net-signal'));col.muted=hex(cs.getPropertyValue('--muted'));
  const bg=hex(cs.getPropertyValue('--bg'));col.dark=(bg[0]+bg[1]+bg[2])<380}
const key=(cx,cy)=>cx*10007+cy;

// ---- the organism: lobes along an upright spine, summed into one field
let shape;
function makeShape(){
  const n=Math.round(rand(3,5)),L=[];let x=0,y=0,ang=rand(-.4,.4);
  for(let i=0;i<n;i++){const r=i===0||i===n-1?rand(.16,.24):rand(.22,.36);
    L.push({x,y,r});ang=clamp(ang+rand(-.8,.8),-.85,.85);const step=rand(.22,.3);x+=Math.cos(ang)*step;y+=Math.sin(ang)*step}
  const ph=Array.from({length:8},()=>rand(0,6.283));
  return {L,ph,
    f(px,py){let s=0;for(const l of L){const d2=(px-l.x)**2+(py-l.y)**2;s+=l.r*l.r/(d2+1e-4)}
      const a=Math.atan2(py-L[0].y,px-L[0].x);
      return s*(1+.24*Math.sin(px*7+ph[0])*Math.cos(py*6+ph[1])+.14*Math.sin(a*4+ph[2])+.09*Math.sin(px*21+py*17+ph[3])+.06*Math.sin(px*41-py*37))},
    // density: 0 = open void, 1 = packed tissue
    d(px,py){const v=.5+.28*Math.sin(px*5.3+ph[4])*Math.cos(py*4.1+ph[5])+.2*Math.sin(px*11.7-py*9.3+ph[6])+.12*Math.cos(px*19+py*23+ph[7]);return clamp(v,0,1)}};
}

// fixed for the approval round; remove the seed to make every visit different again
const SEED=window.__SEED||4;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function generate(){const MR=Math.random;Math.random=mulberry32(SEED);try{generateInner()}finally{Math.random=MR}}
function makeMotes(){const n=Math.round(clamp(W*H/(1440*900),.4,1.4)*420);motes=[];
  for(let i=0;i<n;i++){const z=Math.random();motes.push({x:Math.random()*W,y:Math.random()*H,z,r:.5+z*1.2,a:.07+z*.3,
    vx:(Math.random()-.5)*.006*(.4+z),vy:-(.002+Math.random()*.006)*(.4+z),tp:1500+Math.random()*3000,ph:Math.random()*6.3})}}
function generateInner(){
  W=stage.clientWidth;H=stage.clientHeight;DPR=Math.min(window.devicePixelRatio||1,2);narrow=W<700;
  for(const c of [cS,cL]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)}
  xS.setTransform(DPR,0,0,DPR,0,0);xL.setTransform(DPR,0,0,DPR,0,0);
  shape=makeShape();
  const T=1.15,VOID=.2;
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  for(const l of shape.L){mnx=Math.min(mnx,l.x-l.r*1.6);mxx=Math.max(mxx,l.x+l.r*1.6);mny=Math.min(mny,l.y-l.r*1.6);mxy=Math.max(mxy,l.y+l.r*1.6)}
  // sample: density field decides how packed each area is; voids get a speckled rim
  const raw=[];
  for(let k=0;k<200000&&raw.length<12000;k++){const px=rand(mnx,mxx),py=rand(mny,mxy),v=shape.f(px,py);
    if(v<T)continue;const d=shape.d(px,py);
    if(d<VOID)continue;
    const sk=v<T*1.2||d<VOID+.05;
    const p=sk?.9:.04+d*d*.9;
    if(Math.random()<p)raw.push([px,py,sk?1:0,d])}
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;for(const p of raw){bx0=Math.min(bx0,p[0]);bx1=Math.max(bx1,p[0]);by0=Math.min(by0,p[1]);by1=Math.max(by1,p[1])}
  const box=narrow?{x:W*.04,y:H*.14,w:W*.92,h:H*.72}:{x:W*.14,y:H*.12,w:W*.72,h:H*.76};
  const fit={x:W*.04,y:H*.11,w:W*.92,h:H*.8};
  const sc=Math.min(Math.min(box.w/(bx1-bx0),box.h/(by1-by0))*1.2,fit.w/(bx1-bx0),fit.h/(by1-by0));
  box.x=fit.x;box.y=fit.y;box.w=fit.w;box.h=fit.h;
  const ox=box.x+(box.w-(bx1-bx0)*sc)/2-bx0*sc,oy=box.y+(box.h-(by1-by0)*sc)/2-by0*sc;
  const area=clamp(W*H/(1440*900),.35,1.3);
  const unit=Math.min(W,H)/900;
  // thin: spacing follows density (tight in packed tissue, wide in sparse tissue)
  const cell=Math.max(2.4,2.8*unit),occ=new Map(),pts=[];
  raw.sort(()=>Math.random()-.5);
  const cap=Math.round(2600*area*(narrow?1.1:1));
  for(const p of raw){if(pts.length>=cap)break;
    const x=p[0]*sc+ox,y=p[1]*sc+oy,sp=p[2]?5*unit+1.5:(10+30*(1-p[3])**1.5)*Math.max(.8,unit);
    const r=Math.ceil(sp/cell),gx=Math.floor(x/cell),gy=Math.floor(y/cell);let ok=true;
    for(let dx=-r;dx<=r&&ok;dx++)for(let dy=-r;dy<=r&&ok;dy++){const q=occ.get(key(gx+dx,gy+dy));if(q&&Math.hypot(q[0]-x,q[1]-y)<sp)ok=false}
    if(!ok)continue;occ.set(key(gx,gy),[x,y]);pts.push([x,y,p[2],p[3]])}
  N=pts.length;
  nx=new Float32Array(N);ny=new Float32Array(N);nr=new Float32Array(N);lobeOf=new Int8Array(N);

let px=-1,py=-1,lastMove=-1e9,lastPoke=0,nextAmbient=performance.now()+4500;
const IDLE=4000;
function poke(x,y,count,en,r){const c=near(x,y,r||56);for(let k=0;k<count&&c.length;k++){fire(c.splice(Math.floor(Math.random()*c.length),1)[0],en,performance.now())}}
const hint=document.getElementById('hint');
stage.addEventListener('pointermove',ev=>{const r=stage.getBoundingClientRect();px=ev.clientX-r.left;py=ev.clientY-r.top;lastMove=performance.now();hint.style.opacity=0});
stage.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;const r=stage.getBoundingClientRect();px=ev.clientX-r.left;py=ev.clientY-r.top;lastMove=performance.now();poke(px,py,8,1);hint.style.opacity=0});
stage.addEventListener('pointerleave',()=>{lastMove=-1e9});

let last=performance.now();
function frame(now){
  const dt=Math.min(64,now-last);last=now;
  const active=now-lastMove<140;
  if(active&&now-lastPoke>65){lastPoke=now;poke(px,py,2,.8,28)}
  // breathing: only after a few seconds without interaction, sparse and dim
  if(now-lastMove<IDLE){nextAmbient=Math.max(nextAmbient,now+rand(800,1600))}
  else if(!reduce&&now>nextAmbient){nextAmbient=now+rand(2400,4200);fire(Math.floor(Math.random()*N),.78,now)}
  for(let k=signals.length-1;k>=0;k--){const s=signals[k];if(now>=s.t1){signals[k]=signals[signals.length-1];signals.pop();if(mark[s.to]===2||Math.random()<s.en*1.3)fire(s.to,s.en,now)}}
  // annotation target: the lobe under the pointer, held briefly so it doesn't flicker
  const under=now-lastMove<1500?lobeUnder(px,py):-1;
  if(under!==ann.pending){ann.pending=under;ann.since=now}
  const settled=now-ann.since>(under<0?700:220);
  if(settled&&ann.pending!==ann.lobe){if(ann.lobe>=0)ann.out={lobe:ann.lobe,node:ann.node,t:ann.t,a:1,spot:ann.spot,spotT:1e15,cdir:ann.cdir,ck:ann.ck,cu:ann.cu,cr:ann.cr};ann.lobe=ann.pending;ann.t=0;ann.spot=null;ann.ck=undefined;
    if(ann.lobe>=0){let bi=lobes[ann.lobe].anchor,bd=1e9;for(const j of near(px,py,70)){if(lobeOf[j]!==ann.lobe||dep[j]<0)continue;const d=Math.hypot(nx[j]-px,ny[j]-py);if(d<bd){bd=d;bi=j}}ann.node=bi}}
  if(ann.lobe>=0)ann.t+=dt/1000;
  if(ann.out){ann.out.a-=dt/260;if(ann.out.a<=0)ann.out=null}

  {const on=!reduce&&now-lastMove<1500,e=1-Math.exp(-dt/700);
    const dir=px>=Cx?1:-1;vY+=((on?.26*dir:0)-vY)*e;
    let nY=rY;if(on||Math.abs(vY)>.03)nY=rY+vY*dt/1000;else{const tg=Math.round(rY/6.2832)*6.2832;nY=rY+(tg-rY)*(1-Math.exp(-dt/900))}
    const tX=on?-clamp((py-Cy)/(H*.5),-1,1)*.18:0,nX=rX+(tX-rX)*e;
    if(Math.abs(nY-rY)+Math.abs(nX-rX)>1e-5){rY=nY;rX=nX;project();drawStatic()}}
  xL.clearRect(0,0,W,H);
  if(motes.length){xL.fillStyle=rgba(col.node,1);const pr=Math.sin(rY);
    for(const m of motes){if(!reduce){m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<-10)m.x=W+10;if(m.x>W+10)m.x=-10;if(m.y<-10)m.y=H+10;if(m.y>H+10)m.y=-10}
      const tw=.65+.35*Math.sin(now/m.tp+m.ph);xL.globalAlpha=m.a*tw;xL.fillRect(m.x-pr*m.z*60,m.y,m.r,m.r)}xL.globalAlpha=1}
  if(dust.length){xL.fillStyle=rgba(col.node,1);
    for(let k=0;k<dust.length;k++){const p=dust[k];p.life+=dt/p.max;if(p.life>=1){dust[k]=spawnDust(false);continue}
      p.x+=p.vx*dt;p.y+=p.vy*dt;xL.globalAlpha=Math.sin(p.life*Math.PI)*.45*Math.max(0,Math.cos(rY))**6;xL.fillRect(p.x,p.y,p.r,p.r)}xL.globalAlpha=1}
  xL.globalCompositeOperation='source-over';xL.lineWidth=.45;
  for(const s of signals){const t=clamp((now-s.t0)/(s.t1-s.t0),0,1);
    const ax=nx[s.from],ay=ny[s.from],bx=nx[s.to],by=ny[s.to],hx=ax+(bx-ax)*t,hy=ay+(by-ay)*t,a=clamp(s.en,0,1);
    const c=sigCol(s.en),va=.3+.7*a;
    xL.strokeStyle=rgba(c,va*(col.dark?.75:.95));xL.beginPath();xL.moveTo(ax,ay);xL.lineTo(hx,hy);xL.stroke();
    }
  const kk=Math.exp(-dt/420);lobes.forEach(l=>l.firing=0);
  for(const i of litList){lit[i]*=kk;if(lit[i]<.01){litList.delete(i);continue}if(lit[i]>.3)lobes[lobeOf[i]].firing++;
    const l=lit[i],c=sigCol(litEn[i]);
    for(const e of adj[i]){const j=ea[e]===i?eb[e]:ea[e];if(j<i||lit[j]<.01)continue;const m=Math.min(l,lit[j]);
      xL.strokeStyle=rgba(sigCol((litEn[i]+litEn[j])/2),Math.min(1,m*(col.dark?1.5:2.2))**(col.dark?1.15:.9));xL.lineWidth=.45;xL.beginPath();xL.moveTo(nx[i],ny[i]);xL.lineTo(nx[j],ny[j]);xL.stroke()}
    }
  xL.globalCompositeOperation='source-over';
  if(ann.out)drawAnn(ann.out.lobe,ann.out.t,ann.out.a,now,ann.out.node,ann.out);
  if(ann.lobe>=0)drawAnn(ann.lobe,ann.t,clamp(ann.t/.15,0,1),now,ann.node,ann);
  const idle=now-lastMove;

  requestAnimationFrame(frame);
}

(function(){const g=document.createElement('canvas');g.width=g.height=160;const x=g.getContext('2d'),d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);document.getElementById('grain').style.backgroundImage=`url(${g.toDataURL()})`})();

matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawStatic);
new MutationObserver(drawStatic).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
// dark / light switch: starts from the saved choice, else the system setting
{const btn=document.getElementById('theme'),lab=document.getElementById('themeLabel'),root=document.documentElement;
 const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
 const sync=()=>{const d=isDark();btn.setAttribute('aria-checked',String(d));lab.textContent=d?'Dark':'Light'};
 try{const t=localStorage.getItem('hydra-theme');if(t==='dark'||t==='light')root.dataset.theme=t}catch(e){}
 sync();
 btn.addEventListener('click',ev=>{ev.stopPropagation();if(ev.detail)btn.blur();const next=isDark()?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('hydra-theme',next)}catch(e){}sync()});
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',sync)}
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(stage.clientWidth-W)>2||Math.abs(stage.clientHeight-H)>40)generate()},150)}).observe(stage);

generate();
setTimeout(()=>{const l=lobes[Math.floor(lobes.length/2)];if(l)fire(l.anchor,1,performance.now())},300);
requestAnimationFrame(frame);
})();
</script>
